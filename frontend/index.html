<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario y Pedidos</title>
    <!-- Si tienes un archivo CSS, puedes mantener el enlace -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Gestión de Inventario y Pedidos</h1>
        </header>

        <!-- Tarjetas de Resumen (KPIs) -->
        <section class="kpi-container">
            <div class="card">
                <h3>Total de Insumos</h3>
                <p id="total-items">0</p>
            </div>
            <div class="card">
                <h3>Stock Bajo</h3>
                <p id="low-stock">0</p>
            </div>
        </section>

        <!-- Sección de Inventario -->
        <section class="section">
            <h2>Inventario de Insumos</h2>
            
            <form id="inventory-form" class="form-grid">
                <input type="text" id="name" placeholder="Nombre del insumo" required>
                <input type="number" id="quantity" placeholder="Cantidad" required>
                <input type="text" id="unit" placeholder="Unidad (Ej. Kg, L)" required>
                <input type="number" step="0.01" id="cost" placeholder="Costo Unitario ($)" required>
                <button type="submit" class="btn-primary">Guardar Insumo</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>Insumo</th>
                        <th>Cantidad</th>
                        <th>Costo</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="inventory-list">
                    <!-- Se llena automáticamente con JavaScript -->
                </tbody>
            </table>
        </section>

        <!-- Sección de Pedidos -->
        <section class="section">
            <h2>Gestión de Pedidos</h2>
            
            <form id="order-form" class="form-grid">
                <input type="text" id="client-name" placeholder="Cliente / Pastelería" required>
                <input type="text" id="order-item" placeholder="Insumo o Producto" required>
                <input type="number" id="order-quantity" placeholder="Cantidad" required>
                <button type="submit" class="btn-primary">Crear Pedido</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Insumo</th>
                        <th>Cantidad</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="orders-list">
                    <!-- Se llena automáticamente con JavaScript -->
                </tbody>
            </table>
        </section>
    </div>

    <!-- Enlace al archivo JavaScript -->
    <script src="app.js"></script>
</body>
</html>
